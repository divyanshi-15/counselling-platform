version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-counselling}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d counselling"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/counselling}
      TRUST_PROXY: "1"  # only Caddy can reach the api; honour its X-Forwarded-For
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads  # private credential files: api only, never mounted into caddy
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - appnet

  caddy:
    build:
      context: ./frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # keeps issued certificates across rebuilds
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - appnet

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  appnet:
    driver: bridge
