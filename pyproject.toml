[project]
name = "counselling-platform"
version = "0.1.0"
description = "Counselling practice platform MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.1.18",
  "argon2-cffi>=23.1.0",
  "python-jose[cryptography]>=3.4.0",
  "email-validator>=2.1.1",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "scikit-learn>=1.5.2",
  "pgvector>=0.3.6",
  "fastembed>=0.9,<0.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
